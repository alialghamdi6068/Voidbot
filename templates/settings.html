{% extends 'dashboard.html' %}{% block content %}<div class="top"><div><h1>⚙️ إعدادات {{ guild.name }}</h1><p>اختر الرومات والإعدادات لكل سيرفر بشكل مستقل.</p></div></div><form id="settings-form" class="settings"><label>روم الترحيب<select name="welcome_channel_id"><option value="">بدون</option>{% for c in channels %}<option value="{{ c.id }}" {% if settings.get('welcome_channel_id')|string == c.id|string %}selected{% endif %}># {{ c.name }}</option>{% endfor %}</select></label><label>روم اللوق<select name="log_channel_id"><option value="">بدون</option>{% for c in channels %}<option value="{{ c.id }}" {% if settings.get('log_channel_id')|string == c.id|string %}selected{% endif %}># {{ c.name }}</option>{% endfor %}</select></label><label>روم التقديمات<select name="applications_channel_id"><option value="">بدون</option>{% for c in channels %}<option value="{{ c.id }}" {% if settings.get('applications_channel_id')|string == c.id|string %}selected{% endif %}># {{ c.name }}</option>{% endfor %}</select></label><label>روم الاقتراحات<select name="suggestions_channel_id"><option value="">بدون</option>{% for c in channels %}<option value="{{ c.id }}" {% if settings.get('suggestions_channel_id')|string == c.id|string %}selected{% endif %}># {{ c.name }}</option>{% endfor %}</select></label><label>روم المستويات<select name="level_channel_id"><option value="">بدون</option>{% for c in channels %}<option value="{{ c.id }}" {% if settings.get('level_channel_id')|string == c.id|string %}selected{% endif %}># {{ c.name }}</option>{% endfor %}</select></label><label>قسم التذاكر<select name="ticket_category_id"><option value="">بدون</option>{% for c in categories %}<option value="{{ c.id }}" {% if settings.get('ticket_category_id')|string == c.id|string %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></label><label>رسالة الترحيب<input name="welcome_message" value="{{ settings.get('welcome_message','أهلاً وسهلاً {member} في **{server}**! 👋') }}"></label><label>XP الأدنى<input type="number" name="xp_min" value="{{ settings.get('xp_min',10) }}"></label><label>XP الأعلى<input type="number" name="xp_max" value="{{ settings.get('xp_max',20) }}"></label><label>Cooldown بالثواني<input type="number" name="level_cooldown" value="{{ settings.get('level_cooldown',60) }}"></label><button class="button" type="submit">💾 حفظ الإعدادات</button><p id="result"></p></form><script src="{{ url_for('static', filename='script.js') }}"></script><script>window.FLAME_GUILD={{ guild.id }};</script>{% endblock %}
