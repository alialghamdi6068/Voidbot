<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Flame Dashboard' }}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}"></head><body><aside class="sidebar"><div class="brand">🔥 Flame</div>{% if guild %}<a href="{{ url_for('dashboard', guild_id=guild.id) }}">الرئيسية</a><a href="{{ url_for('settings', guild_id=guild.id) }}">⚙️ الإعدادات</a><a href="{{ url_for('activity', guild_id=guild.id) }}">📋 النشاط</a><a href="{{ url_for('commands_page', guild_id=guild.id) }}">⌨️ الأوامر</a>{% else %}<a href="{{ url_for('servers') }}">🖥️ السيرفرات</a>{% endif %}<a href="{{ url_for('logout') }}">🚪 خروج</a></aside><main class="main">{% block content %}{% endblock %}</main></body></html>
